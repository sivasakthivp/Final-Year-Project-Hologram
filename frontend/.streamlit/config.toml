[server]
headless = false
port = 8501
runOnSave = true
allowRunOnSave = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00d4ff"
backgroundColor = "#020b18"
secondaryBackgroundColor = "#040f20"
textColor = "#c8e6f5"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[logger]
level = "info"
